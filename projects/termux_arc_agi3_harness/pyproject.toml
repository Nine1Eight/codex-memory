[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc3-termux-harness"
version = "0.1.0"
description = "Termux offline ARC-AGI-3 public 25-game training harness"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2,<3",
  "typing-extensions>=4.8",
]

[project.scripts]
arc3-harness = "arc3_harness.cli:main"

[tool.setuptools]
packages = ["arc3_harness", "arcengine"]
include-package-data = true

[tool.setuptools.package-data]
arc3_harness = ["../data/*.json"]
