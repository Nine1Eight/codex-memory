[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpcr-git-residual-builder"
version = "1.0.0"
description = "CPCR-GIT Residual Adapter Builder v1 for rank<=32 LoRA adapter corpus/package validation"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "safetensors",
]

[project.scripts]
cpcr-git = "cpcr_git_builder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
