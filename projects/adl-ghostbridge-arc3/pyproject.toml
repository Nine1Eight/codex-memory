[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adl-ghostbridge-arc3"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
kaggle = ["pandas>=2", "pyarrow>=14"]

[tool.setuptools]
packages = ["agent","adl","adl_vnext","adapters","detectors","ghostbridge","memory","planning","prl","scheduler","scoring","telemetry","world"]
