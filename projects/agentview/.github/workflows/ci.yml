name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test deps
        run: python3 -m pip install --user fastapi uvicorn httpx2
      - name: Run verify
        run: make verify
      - name: Run api tests
        run: python3 -m pytest -q apps/api/tests/test_api.py apps/api/tests/test_setup_status.py packages/identity/tests/test_auth.py packages/security/tests/test_crypto.py packages/persistence/tests/test_store.py packages/domain/tests/test_protocol.py
